# ─────────────────────────────────────────────────────────────────────────────
# Nav2 AMCL parameters for the comparison with the custom MCL
#
# Same map and same robot motion. AMCL uses a simulated laser scan instead of
# landmark readings.
# ─────────────────────────────────────────────────────────────────────────────
amcl:
  ros__parameters:
    use_sim_time: false

    # ── Motion model ────────────────────────────────────────────────────────
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.1          # rotation noise from rotation
    alpha2: 0.1          # rotation noise from translation
    alpha3: 0.1          # translation noise from translation
    alpha4: 0.1          # translation noise from rotation
    alpha5: 0.1          # translation noise (omnidirectional)

    # ── Sensor model ───────────────────────────────────────────────────────
    laser_model_type: "likelihood_field"
    laser_max_range: 15.0
    laser_min_range: 0.1
    max_beams: 36
    sigma_hit: 0.2
    z_hit: 0.95
    z_rand: 0.05
    z_max: 0.0
    z_short: 0.0
    laser_likelihood_max_dist: 1.0

    # ── Particle filter ────────────────────────────────────────────────────
    # After a kidnap AMCL is re-initialised uniformly over the whole map, and
    # needs enough particles for some of them to land near the true pose.
    # With 1000 it almost never re-converged. KLD-sampling brings the count
    # back down towards min_particles once the filter has converged.
    min_particles: 500
    max_particles: 20000
    pf_err: 0.01
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1

    # ── Frames ─────────────────────────────────────────────────────────────
    base_frame_id:   "amcl_base"
    odom_frame_id:   "odom"
    global_frame_id: "map"

    # ── Topics ─────────────────────────────────────────────────────────────
    scan_topic: "/amcl_scan"

    # ── Update thresholds ──────────────────────────────────────────────────
    update_min_a: 0.02       # radians (~1°) before filter update
    update_min_d: 0.02       # metres before filter update

    # ── TF ─────────────────────────────────────────────────────────────────
    tf_broadcast: true
    transform_tolerance: 2.0

    # ── Initial pose (overridden by global localization call) ──────────────
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0

    # ── Misc ───────────────────────────────────────────────────────────────
    save_pose_rate: 0.5
